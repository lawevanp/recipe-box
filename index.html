<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Box</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Recipe<span>Box</span></a>
      <nav class="nav">
        <a href="index.html" class="active">Home</a>
        <a href="recipes.html">All Recipes</a>
        <a href="recipes.html?type=entree">Entrees</a>
        <a href="recipes.html?type=dessert">Desserts</a>
        <a class="nav-add" href="https://recipe-box-submit.lawevanp.workers.dev/">+ Add recipe</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>What are we cooking?</h1>
      <p>Search all <span id="total">our</span> family recipes by name or ingredient.</p>
      <form class="search-form" action="recipes.html" method="get">
        <input type="search" name="q" placeholder="Try &quot;chicken&quot; or &quot;chocolate&quot;" aria-label="Search recipes">
        <button class="btn" type="submit">Search</button>
      </form>
    </div>

    <section>
      <div class="section-title"><h2>Browse by type</h2></div>
      <div class="categories" id="categories"></div>
    </section>

    <section>
      <div class="section-title">
        <h2>Try something new</h2>
        <a href="recipes.html">See all →</a>
      </div>
      <div class="recipe-grid" id="featured"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> Recipe Box</div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    loadRecipes().then(() => {
      document.getElementById("total").textContent = RECIPES.length;
      document.getElementById("categories").innerHTML = CATEGORIES.map((c) => {
        const n = RECIPES.filter((r) => r.category === c.id).length;
        return `
          <a class="category-tile" href="recipes.html?type=${c.id}">
            <span class="emoji">${c.emoji}</span>
            <span class="name">${c.name}</span>
            <span class="count">${n} recipe${n === 1 ? "" : "s"}</span>
          </a>`;
      }).join("");

      // A different handful of recipes on every visit.
      const picks = [...RECIPES].sort(() => Math.random() - 0.5).slice(0, 8);
      document.getElementById("featured").innerHTML = picks.map(recipeCardHtml).join("");
    });
  </script>
</body>
</html>
