name: Add a recipe from a photo
description: Attach a picture of a recipe and Claude will type it up for the site.
title: "New recipe: "
labels: ["new-recipe"]
body:
  - type: markdown
    attributes:
      value: |
        Attach one or more photos of a recipe (front and back of a card is fine, and so are several recipes at once).
        Claude will type it up and open a pull request for you to check. Once you merge it, the recipe shows up on the site.

        **Heads up:** this repository is public, so the photos you attach here are public too.
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Drag photos into this box, or tap it and attach them. You can also paste or type a recipe here.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Dish type
      description: Leave as "Let Claude decide" if you're not sure.
      options:
        - Let Claude decide
        - breakfast
        - entree
        - side
        - soup
        - bread
        - dessert
        - snack
        - sauce
      default: 0
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Anything to add, e.g. "This is Grandma's" or "use 325°F, not 350°F".
